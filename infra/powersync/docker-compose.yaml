# Service de synchronisation PowerSync auto-hébergé (développement local).
# Prérequis : `supabase start` (réseau docker supabase_network_siteflow).
name: imula-powersync

services:
  powersync:
    image: journeyapps/powersync-service:${PS_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      powersync-storage:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: postgres://powersync:${PS_STORAGE_PASSWORD}@powersync-storage:5432/powersync_storage
      PS_JWKS_URI: ${PS_JWKS_URI}
      PS_PORT: ${PS_PORT}
      PS_API_TOKEN: ${PS_API_TOKEN}
    volumes:
      - ./config:/config:ro
    ports:
      - "${PS_PORT}:${PS_PORT}"
    networks: [default, supabase]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20

  # Stockage des buckets de synchronisation (Postgres dédié, distinct de la base applicative).
  powersync-storage:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: powersync
      POSTGRES_PASSWORD: ${PS_STORAGE_PASSWORD}
      POSTGRES_DB: powersync_storage
    volumes:
      - powersync_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powersync -d powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  powersync_storage:

networks:
  supabase:
    name: supabase_network_siteflow
    external: true
